spring:
  application:
    name: booking-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DATABASE_USER:booking}
    password: ${DATABASE_PASSWORD:booking}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

server:
  error:
    include-message: never
  shutdown: graceful

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: booking-api
    ttl: 2h
  demo-data: ${DEMO_DATA:false}

springdoc:
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
